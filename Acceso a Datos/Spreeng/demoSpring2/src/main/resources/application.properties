spring.application.name=demoCarga



spring.datasource.url=jdbc:mysql://localhost:3306/democarga
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create

#para que los mensajes de hibernate se vean mmjr
#spring.jpa.properties.hibernate.format_sql=true

#Indica que la aplicación Spring Boot no va a funcionar como una aplicación web. (no habre puertos, no inicia un servidor web)
spring.main.web-application-type=none

# El nivel gloval de los logs
logging.level.root=INFO

# Para guardar logs hasta el nivel de debug
logging.level.org.iesch.ad=DEBUG


# Donde se guardan los logs
logging.file.name=logging/app.log