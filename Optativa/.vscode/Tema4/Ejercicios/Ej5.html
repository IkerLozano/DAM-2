<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej 5</title>
</head>
<body >



    <p id="p" >Cordenadas: </p>


    <script>


        document.addEventListener("mousemove", coordenadas)

        function coordenadas(evento) {


            document.getElementById("p").textContent = "Cordenadas: " +  evento.clientX  + " " + evento.clientY
            
           
        }


    </script>
    
</body>
</html>
