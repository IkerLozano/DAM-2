<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba eventos</title>
</head>

<body>



    <button id="boton">Otro boton</button>

    <script>


        let boton = document.getElementById("boton");


        function saludar() {
            alert("Hola");
        }

        boton.onclick = saludar;




    </script>

</body>

</html>
