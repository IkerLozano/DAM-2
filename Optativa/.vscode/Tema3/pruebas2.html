<!DOCTYPE html>
<html lang="es">
<head>

    <script>

            // ARRAY DE EJEMPLO
            let numeros = [1, 2, 3, 4, 5];


            // 1. JOIN()
            // Une todos los elementos en una cadena
            let texto = numeros.join("-");
            console.log("JOIN:", texto);


            // 2. PUSH()
            // Añade elementos al final
            numeros.push(6, 7);
            console.log("PUSH:", numeros);


            // 3. POP()
            // Elimina y devuelve el último elemento
            let eliminado = numeros.pop();
            console.log("POP - elemento eliminado:", eliminado);
            console.log("POP - array:", numeros);


            // 4. REVERSE()
            // Invierte el orden del array
            numeros.reverse();
            console.log("REVERSE:", numeros);


            // 5. SORT()
            // Ordena alfabéticamente
            let numeros2 = ["casa", "coche", "avion", "nube"];
            numeros2.sort();
            console.log("SORT:", numeros2);


            // 6. SLICE()
            // Coge una parte del array
            let parte = numeros.slice(1, 3); //coga el elemento de la posicion 1 y 3
            console.log("SLICE:", parte);


            
            // FLOOR
            console.log(Math.floor(4.8)); // 4

            // CEIL
            console.log(Math.ceil(4.2)); // 5

            // ROUND
            console.log(Math.round(4.6)); // 5

            // ABS
            console.log(Math.abs(-10)); // 10

            // MAX
            console.log(Math.max(5, 9)); // 9

            // MIN
            console.log(Math.min(5, 9)); // 5

            // POW
            console.log(Math.pow(2, 3)); // 8

            // SQRT
            console.log(Math.sqrt(25)); // 5

            // RANDOM
            console.log(Math.random()); // Ej: 0.73452...


            // Número aleatorio entre 1 y 10
            let numero = parseInt((Math.random() * 10) + 1);
            console.log(numero);
