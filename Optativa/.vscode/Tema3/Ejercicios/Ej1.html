<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej 1</title>
</head>


    <script>


        let array = []
        let sum = 0
        let cont = 0
        let media = 0
        let num;

        do{

            num = Number(prompt("Dime un numero"))
            
            if(Number.isNaN(num)){
                continue;
            }else{
                array.push(num)
                sum = sum+num
                cont = cont+1
            }
            
        }while(num!=0)

        array.pop() //para sacar el 0
        cont = cont - 1 //para que en la catidad de nuemros del arry no me cuente el 0


        media = sum/cont
        
        document.write("La media es " + media)

    </script>

</body>
</html>
