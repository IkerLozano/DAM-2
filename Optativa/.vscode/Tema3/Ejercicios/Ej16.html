<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej 16</title>

    <style>
        table {
            border-collapse: collapse;
            text-align: center;
        }

        td,
        th {
            border: 2px solid green;
            width: 100px;
        }
    </style>
</head>

<script>

    let horario = [
        ["IPPE", "PROY", "IPPE", "AD", "SGE"],
        ["DI", "SGE", "AD", "AD", "SGE"],
        ["DI", "SGE", "AD", "AD", "SASP"],
        ["RECREO", "RECREO", "RECREO", "RECREO", "RECREO"],
        ["DWC", "PMDM", "PMDM", "PROY", "DI"],
        ["DWC", "PMDM", "PMDM", "PSP", "DI"],
        ["DWC", "PMDM", "PMDM", "PSP", "DI"]
    ];


    let dias = [" ", "lunes", "martes", "miercoles", "jueves", "viernes"]

    document.write("<table>")

    //FILA DE LOS DIAS
    document.write("<tr>")
    for (let i = 0; i < dias.length; i++) {
        document.write("<th>" + dias[i] + "</th>")

    }
    document.write("</tr>")


    let horaInicio = new Date(2026, 1, 1, 15, 45) //hora de inicio de la clase (la fecha da igual)
    let horaInicio2 = new Date(2026, 1, 1, 16, 35) //hora de final de la clase (la fecha da igual)
    console.log(horaInicio)

    //PONGO LAS ASIGNATURAS
    for (let i = 0; i < horario.length; i++) {
        //console.log(horario.length);

        document.write("<tr>")


        if (i == 0 || i == 1) {
            document.write("<td>" + horaInicio.getHours() + ":" + horaInicio.getMinutes() + " - " + horaInicio2.getHours() + ":" + horaInicio2.getMinutes() + "</td>")
            horaInicio.setMinutes(horaInicio.getMinutes() + 55)
            horaInicio2.setMinutes(horaInicio2.getMinutes() + 55)
        }else if (i == 2){
            document.write("<td>" + horaInicio.getHours() + ":" + horaInicio.getMinutes() + " - " + horaInicio2.getHours() + ":" + horaInicio2.getMinutes() + "</td>")
            horaInicio.setMinutes(horaInicio.getMinutes() + 50)
            horaInicio2.setMinutes(horaInicio2.getMinutes() + 15)
        }else if(i == 3){
            document.write("<td>" + horaInicio.getHours() + ":" + horaInicio.getMinutes() + " - " + horaInicio2.getHours() + ":" + horaInicio2.getMinutes() + "</td>")
            horaInicio.setMinutes(horaInicio.getMinutes() + 15)
            horaInicio2.setMinutes(horaInicio2.getMinutes() + 50)
        }else if (i == 4){
            document.write("<td>" + horaInicio.getHours() + ":" + horaInicio.getMinutes() + " - " + horaInicio2.getHours() + ":" + horaInicio2.getMinutes() + "</td>")
            horaInicio.setMinutes(horaInicio.getMinutes() + 55)
            horaInicio2.setMinutes(horaInicio2.getMinutes() + 55)
        }else{
            document.write("<td>" + horaInicio.getHours() + ":" + horaInicio.getMinutes() + " - " + horaInicio2.getHours() + ":" + horaInicio2.getMinutes() + "</td>")
            horaInicio.setMinutes(horaInicio.getMinutes() + 55)
            horaInicio2.setMinutes(horaInicio2.getMinutes() + 55)
        }


        for (let j = 0; j < horario[i].length; j++) {
            document.write("<td>" + horario[i][j] + "</td>")

        }


        document.write("</tr>")
    }

    document.write("</table>")


</script>

</html>
