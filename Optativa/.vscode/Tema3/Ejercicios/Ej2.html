    <script>


        var letras = ['T', 'R', 'W', 'A', 'G', 'M', 'Y', 'F', 'P', 'D', 'X', 'B', 'N', 'J', 'Z', 'S', 'Q', 'V', 'H', 'L', 'C', 'K', 'E', 'T']; 

        let dni = prompt("Dime tu DNI")

        let nuemros = dni.substring(0,8)
        let letra = dni.substring(8,9)

        //document.write("Numeros :" + nuemros + "<br/>")
        //document.write("letra:" + letra)
        //18468452G

        let resto = nuemros%23
        
        let result = letras[resto]

        if(result == letra){
            document.write("El DNI es correcto")
        }else{
            document.write("El DNI no es correcto")
        }

    </script>
