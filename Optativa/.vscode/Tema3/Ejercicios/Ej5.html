<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej 5</title>

    <style>
        table {
            border-collapse: collapse;
            text-align: center;
        }

        td,
        th {
            border: 2px solid green;
            width: 100px;
        }
    </style>

</head>


<script>

    var festivos = [[1, 6], [], [], [17, 18, 23], [1], [], [], [15], [], [1, 2], [1], [6, 8, 25]];
    var dias = ["lunes", "martes", "miercoles", "jueves", "viernes", "Sabado", "Domingo"]

    var mesUsuario = prompt("Dime un mes")
    var mesUsuarioMayus = mesUsuario.toUpperCase()
    var mesNumero
    //var diasDeMes = me

    switch (mesUsuarioMayus) {
        case "ENERO":
            mesNumero = 0;
            break;
        case "FEBRERO":
            mesNumero = 1;
            break;
        case "MARZO":
            mesNumero = 2;
            break;
        case "ABRIL":
            mesNumero = 3;
            break;
        case "MAYO":
            mesNumero = 4;
            break;
        case "JUNIO":
            mesNumero = 5;
            break;
        case "JULIO":
            mesNumero = 6;
            break;
        case "AGOSTO":
            mesNumero = 7;
            break;
        case "SEPTIEMBRE":
            mesNumero = 8;
            break;
        case "OCTUBRE":
            mesNumero = 9;
            break;
        case "NOVIEMBRE":
            mesNumero = 10;
            break;
        case "DICIEMBRE":
            mesNumero = 11;
            break;
        default:
            console.log("No es un mes")
            break;
    }


    //creo una fecha completa del dia 1 del mes del usuario
    let fechaConMesUsuario = new Date(2026, mesNumero, 1)
    console.log(fechaConMesUsuario)

    //saco el año de esa fecha
    let anioDeFechaUser = fechaConMesUsuario.getFullYear()
    console.log(anioDeFechaUser)

    //obtengo que dia de la semana(lunes, martes....) era el primer dia del mes
    let diaSemana = fechaConMesUsuario.getDay()
    console.log(diaSemana)

    //obtengo la fecha completa del ultimo dia del mes
    //poniendo 0 lo que hago es obetner el ultimo dia
    let fechaUltimoDiaMes = new Date(anioDeFechaUser, mesNumero + 1, 0)
    console.log(fechaUltimoDiaMes)

    //obtengo el ultimo dia del mes
    let numeroUltimoDiaMes = fechaUltimoDiaMes.getDate()
    console.log(numeroUltimoDiaMes)

    //Adapto el domingo de 0 a 7 para que la semana empiece en lunes.
    if (diaSemana == 0) {
        diaSemana = 7;
    }




    
    document.write("<table>")

    //FILA DE LOS DIAS
    document.write("<tr>")

    for (let i = 0; i < dias.length; i++) {

        document.write("<th>" + dias[i] + "</th>")

    }

    document.write("</tr>")



    //FILA DE LOS NUMEROS
    document.write("<tr>")

    //con esto pongo las celdas vacias antes del dia 1
    for (let a = 1; a < diaSemana; a++) {
        document.write("<td>" + " " + "</td>")

    }


    var cont = diaSemana - 1//con esto se cuantas celdas estan vacias

    //recorro todos los dias del mes
    for (let i = 1; i <= numeroUltimoDiaMes; i++) {

        //para los dias festivos
        if (festivos[mesNumero].includes(i)) {
            document.write("<td style='color: red'>" + i + "</td>");
        } else {
            document.write("<td>" + i + "</td>");
        }
        /*
            festivos[mesNumero] --> seleciona los festivos del mes
                festivos[0] ->  [1, 6] (enero)
            includes(i) --> Comprueba si el número que contiene i está dentro de ese array.
                [1, 6].includes(6) --> devuelve tru/false
        */



        cont++
        if (cont % 7 == 0) {
            document.write("<tr>")

            document.write("</tr>")
        }

    }
    document.write("</tr>")


    document.write("</table>")




</script>

<body>

</body>

</html>
