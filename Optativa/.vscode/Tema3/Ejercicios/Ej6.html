<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej 6</title>
</head>


    <script>

        let email = "info@elcorreo.com"

        let patron = /^[A-Za-z]+\@[A-Za-z]+\.[A-Za-z]{3,}$/


        let arroba= email.indexOf("@")
        let ultimo = email.length 

        if(patron.test(email)){
            document.write("El email es correcto" + "<br/>")
            document.write("nombre de usuario --> " + email.substring(0, arroba) + "<br/>")
            document.write("nombre de dominio --> " + email.substring(arroba+1, ultimo))
        }else{
            document.write("El email no es corrceto")
        }


    </script>

</body>
</html>
