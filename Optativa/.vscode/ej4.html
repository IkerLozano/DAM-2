<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej 4</title>
</head>
<body>
    
<script>

    let num1 = 5
    let num2 = 10

    let operacion = prompt("Que operacion quieres hacer (+, -, *, / )")

    if (operacion == "+"){
        console.log(num1 + " + " + num2 + " = " + (num1+num2))
    }else if(operacion == "-"){
                console.log(num1 + " - " + num2 + " = " + (num1-num2))
    }else if(operacion == "*"){
                console.log(num1 + " * " + num2 + " = " + (num1*num2))
    }else if(operacion == "/"){
                console.log(num1 + " / " + num2 + " = " + (num1/num2))
    }else{
        console.log("Mal")
    }

</script>

</body>
</html>
