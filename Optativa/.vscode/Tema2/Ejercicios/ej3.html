<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej 3</title>

    <style>

        table, th, td { 
            border: 1px solid black; 
            border-collapse: separate; 
            border-spacing: 6px; } 
        
        
        td, th { 
            padding: 6px; 
            text-align: center;
        }

    </style>
</head>


    <script>

        let num = prompt("Dime un numero")

        for(let i = 1; i<=10; i++){
        
            document.write("<section>")
            document.write("<table>")
            document.write("<td>")
            document.write(i + "X" + num + "=" + (i*num) + "<br/>")
            document.write("</td>")
            document.write("</table>")
            document.write("</section>")
            
        }

    </script>

<body>

    <section>

        <table>

            <th></th>

        </table>

    </section>
    
</body>
</html>
