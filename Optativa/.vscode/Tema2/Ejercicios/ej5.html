    <script>

        let num1 = prompt("Dime un numero")
        let num2 = prompt("Dime otro numero")


        if (num1 < num2 ){
            document.write("El numero " + num1 + " es mayor que el " + num2)
        }else if (num1 > num2) {
            document.write("El numero " + num1 + " es menor que el " + num2)
        }else{
            document.write("Son iguales")
        }

    </script>
