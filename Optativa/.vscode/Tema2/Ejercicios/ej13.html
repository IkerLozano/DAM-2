<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej 13</title>
</head>


<script>

    let num = prompt("Dime un numero")


    if (num % 2 == 0) {

        num -= 1

    }


    let asteriscos = parseInt(num / 2)

    for (let i = 1; i <= num; i++) {


        if (i % 2 != 0) {

            //* 1
            for (let h = 0; h < asteriscos; h++) {

                document.write("*")

            }

            //numero
            for (let j = 0; j < i; j++) {

                document.write(i)
            }


            //* 2
            for (let h = 0; h < asteriscos; h++) {

                document.write("*")

            }

            
            asteriscos--
            document.write("<br/>")
        }





    }

</script>

<body>

</body>

</html>
