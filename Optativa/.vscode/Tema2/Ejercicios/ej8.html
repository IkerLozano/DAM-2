    <script>

        let num = prompt("Hasta que numero quieres llegar")

        for(let i = 1; i<=num; i++){ //controla que numero dibujamos
            
            for(let j = 1; j <= i; j++){
                document.write(i)
            }
            document.write("<br/>")
        }

    </script>
