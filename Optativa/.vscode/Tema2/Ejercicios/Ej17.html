<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej 17</title>
</head>

<body>

    <script>

        let caracter = prompt("Introduce un carácter");

        
        switch (true) {

            case caracter >= "0" && caracter <= "9":
                document.write("Es un número");
                break;

            case "aeiou".includes(caracter.toLowerCase()) && caracter === caracter.toLowerCase():
                document.write("Es una vocal");
                break;

            case "aeiou".includes(caracter.toLowerCase()) && caracter === caracter.toUpperCase():
                document.write("Es una vocal en mayúsculas");
                break;

            case caracter >= "A" && caracter <= "Z":
                document.write("Es una consonante en mayúsculas");
                break;

            case caracter >= "a" && caracter <= "z":
                document.write("Es una consonante");
                break;

            default:
                document.write("Es otro carácter");
                break;
        }

    </script>

</body>
</html>
