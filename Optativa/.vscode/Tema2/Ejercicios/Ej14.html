<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej 14</title>
</head>

<body>


    <script>

        let numero = prompt("Dime un numero")

        for (let i = numero; i >= 1; i--) {
            
            document.write("<br>")

            for (let h = 0; h<numero-i; h++) {
                
                document.write("*")
                
            }

            for (let j = i; j >=1; j--) {
              
                document.write(i)
            }

            
            
        }



    </script>


</body>

</html>
