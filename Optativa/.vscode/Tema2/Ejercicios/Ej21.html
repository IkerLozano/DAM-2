<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .btn{
        padding: 10px;
    }
</style>
<body>
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;">
        <button class="btn" id="btn1">1</button>
        <button class="btn" id="btn2">2</button>
        <button class="btn" id="btn3">3</button>
        <button class="btn" id="btn+">+</button>
        <button class="btn" id="btn4">4</button>
        <button class="btn" id="btn5">5</button>
        <button class="btn" id="btn6">6</button>
        <button class="btn" id="btn-">-</button>
        <button class="btn" id="btn7">7</button>
        <button class="btn" id="btn8">8</button>
        <button class="btn" id="btn9">9</button>
        <button class="btn" id="btn*">*</button>
        <button class="btn" id="btn0">0</button>
        <button class="btn" id="btn=" style="grid-column: span 2;">=</button>
        <button class="btn" id="btn/">/</button>
        <button class="btn" id="btnC">C</button>
    </div>

    <p id="texto" style="padding: 20px; background-color: rgb(209, 209, 209); border-radius: 8px;"></p>
    
    <script>
        document.getElementById("btn1").onclick=escribir
        document.getElementById("btn2").onclick=escribir
        document.getElementById("btn3").onclick=escribir
        document.getElementById("btn4").onclick=escribir
        document.getElementById("btn5").onclick=escribir
        document.getElementById("btn6").onclick=escribir
        document.getElementById("btn7").onclick=escribir
        document.getElementById("btn8").onclick=escribir
        document.getElementById("btn9").onclick=escribir
        document.getElementById("btn0").onclick=escribir
        document.getElementById("btn+").onclick=operar
        document.getElementById("btn-").onclick=operar
        document.getElementById("btn*").onclick=operar
        document.getElementById("btn=").onclick=calcular
        document.getElementById("btn/").onclick=operar
        document.getElementById("btnC").onclick=borrar

        elementos = ["", ""]

        function escribir(){
            document.getElementById("texto").textContent = document.getElementById("texto").textContent.concat(this.textContent)
        }

        function operar(){
            if(elementos[0] == ""){
                elementos[0] = document.getElementById("texto").textContent
                elementos[1] = this.textContent
                document.getElementById("texto").textContent = ""
            } else {
                calcular()
                elementos[1] = this.textContent
            }
        }

        function borrar(){
            document.getElementById("texto").textContent = ""
        }

        function calcular(){
            if(elementos[0]!="" && document.getElementById("texto").textContent!=""){
                if(elementos[1]=="+"){
                    document.getElementById("texto").textContent = parseInt(elementos[0])+parseInt(document.getElementById("texto").textContent)
                } else if (elementos[1]=="-"){
                    document.getElementById("texto").textContent = parseInt(elementos[0])-parseInt(document.getElementById("texto").textContent)
                } else if (elementos[1]=="*"){
                    document.getElementById("texto").textContent = parseInt(elementos[0])*parseInt(document.getElementById("texto").textContent)
                } else if (elementos[1]=="/"){
                    document.getElementById("texto").textContent = parseInt(elementos[0])/parseInt(document.getElementById("texto").textContent)
                }
                elementos[0]=""
                elementos[1]=""
            }
        }
    </script>
</body>
</html>
