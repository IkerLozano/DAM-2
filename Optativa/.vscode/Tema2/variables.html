<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pruebas</title>
</head>
<body>


    <script>

        let numero = 5;

        console.log("Tengo " + numero); //aqui el 5 lo interpreta como texto (string)


        console.log(numero) //aqui lo intepreta como numero (number)


        let a = "2", b = 5;
        console.log( typeof a + " " + typeof b); // string,  number
        console.log( a + b ); // nos muestra 25
        //si a en vez de ponerlo como string, le quitamos las comillas nos mostrara 7



        console.log( 5 == "5" ) //true
        console.log(  5 === "5") //false

        console.log("15" < 100) //true, si uno es number y el otro string, convierte los dos a numeros
        console.log( "10" < "9") //true, si los dos son string los compara como texto
       


    </script>
    
</body>
</html>
